plugins {
    id "com.android.application"
}

// The bootstrap contains the base Termux userspace (apt/dpkg, shell, core
// utilities and certificates). Language packages are installed from the Termux
// repository on first run by harness-core.
def bootstrapVersion = "2026.02.12-r1%2Bapt.android-7"
def bootstrapAssets = [
    "aarch64": [
        url: "https://github.com/termux/termux-packages/releases/download/bootstrap-${bootstrapVersion}/bootstrap-aarch64.zip",
        sha256: "ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3"
    ],
    "x86_64": [
        url: "https://github.com/termux/termux-packages/releases/download/bootstrap-${bootstrapVersion}/bootstrap-x86_64.zip",
        sha256: "b7fd0f2e3a4de534be3144f9f91acc768630fc463eaf134ab2e64c545e834f7a"
    ]
]

def bootstrapOutput = layout.buildDirectory.dir("generated/harness-bootstrap/assets")

android {
    namespace "io.mcyber12.codingharness"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "io.mcyber12.codingharness"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 40
        versionName "0.33.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        main {
            assets.srcDir(bootstrapOutput)
        }
    }

    // Note: no jniLibs packaging override - libharness-exec.so is extracted
    // from the APK at bootstrap-provisioning time instead (see
    // HarnessBootstrap.ensureHarnessExecLibrary), because modern AGP keeps
    // .so files compressed and a dlopen() path cannot point into the APK.

    // The androidTest variant follows this property, so a build type other than
    // `debug` can be instrumented without changing the default pipeline:
    //   ./gradlew :app:connectedSealedAndroidTest -PharnessTestBuildType=sealed
    testBuildType = (findProperty("harnessTestBuildType") ?: "debug").toString()

    packagingOptions {
        // The sealed variant ships a PIE executable under a JNI library name
        // (see terminal-emulator/src/main/jni/harness-probe.c). Stripping an
        // executable is not the same operation as stripping a library, so it
        // is excluded rather than trusted to survive --strip-unneeded.
        jniLibs {
            keepDebugSymbols.add("**/libharnessprobe.so")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        // `sealed`: the store-shaped build (docs/play-store-plan.md).
        //
        // Two things change, and only these two:
        //   * app/src/sealed/AndroidManifest.xml sets extractNativeLibs=true,
        //     so the executables this build ships are extracted to the native
        //     library directory as real files. Without that they stay inside
        //     the APK, where nothing can execve() them.
        //   * it is built with -PharnessTargetSdk=34, i.e. the target a store
        //     submission would need, which is the point of the variant: the
        //     data-dir exec exemption is gone, so anything that still runs
        //     proves the sealed layout carries the harness.
        // It is debuggable so instrumentation and run-as can inspect it; it
        // shares the debug signing key and the shipping applicationId, exactly
        // like the `smoke` variant in the reference harness.
        sealed {
            initWith(getByName("debug"))
            debuggable = true
            matchingFallbacks.addAll(["debug", "release"])
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def sha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        int count
        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}

def downloadBootstrap = tasks.register("downloadHarnessBootstrap") {
    outputs.dir(bootstrapOutput)
    doLast {
        File outputDir = bootstrapOutput.get().asFile
        outputDir.mkdirs()
        bootstrapAssets.each { arch, metadata ->
            File output = new File(outputDir, "bootstrap-${arch}.zip")
            boolean valid = output.isFile() && sha256(output) == metadata.sha256
            if (valid) return

            logger.lifecycle("Downloading Termux bootstrap for ${arch}")
            File temporary = new File(outputDir, output.name + ".part")
            temporary.delete()
            def connection = new URL(metadata.url).openConnection()
            connection.setConnectTimeout(30_000)
            connection.setReadTimeout(180_000)
            connection.setUseCaches(false)
            connection.inputStream.withCloseable { input ->
                temporary.withOutputStream { outputStream ->
                    byte[] buffer = new byte[64 * 1024]
                    int count
                    while ((count = input.read(buffer)) != -1) outputStream.write(buffer, 0, count)
                }
            }
            if (sha256(temporary) != metadata.sha256) {
                temporary.delete()
                throw new GradleException("SHA-256 mismatch for ${metadata.url}")
            }
            if (output.exists() && !output.delete()) throw new GradleException("Unable to replace ${output}")
            if (!temporary.renameTo(output)) throw new GradleException("Unable to activate ${output}")
        }
    }
}

tasks.matching { it.name in ["preDebugBuild", "preReleaseBuild"] }.configureEach {
    dependsOn(downloadBootstrap)
}

dependencies {
    implementation project(":harness-core")
    implementation project(":terminal-view")

    androidTestImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
