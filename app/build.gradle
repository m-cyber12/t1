plugins {
    id "com.android.application"
}

// The bootstrap contains the base Termux userspace (apt/dpkg, shell, core
// utilities and certificates). Language packages are installed from the Termux
// repository on first run by harness-core.
def bootstrapVersion = "2026.02.12-r1%2Bapt.android-7"
def bootstrapAssets = [
    "aarch64": [
        url: "https://github.com/termux/termux-packages/releases/download/bootstrap-${bootstrapVersion}/bootstrap-aarch64.zip",
        sha256: "ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3"
    ],
    "x86_64": [
        url: "https://github.com/termux/termux-packages/releases/download/bootstrap-${bootstrapVersion}/bootstrap-x86_64.zip",
        sha256: "b7fd0f2e3a4de534be3144f9f91acc768630fc463eaf134ab2e64c545e834f7a"
    ]
]

def bootstrapOutput = layout.buildDirectory.dir("generated/harness-bootstrap/assets")
// A project property rather than a script local: the `sealed` source set is
// configured inside an AGP closure whose delegate resolves properties first,
// so a plain local would not be visible there.
ext.sealedPayloadDir = layout.buildDirectory.dir("generated/sealed-payload")
// Packages the apt build installs on first run (PackageTier.CORE). The sealed
// build fetches exactly these at build time, because it may not fetch them at
// runtime: Play's Device & Network Abuse policy and the exec model both require
// the binaries to come out of the APK.
ext.sealedCorePackages = [
    "git", "ripgrep", "python", "python-pip", "nodejs", "npm",
    "perl", "ruby", "jq", "tree", "which", "file", "openssh",
]
ext.sealedDebDir = layout.buildDirectory.dir("generated/sealed-debs")
// Mirror override, mainly so the pipeline can be exercised against a snapshot.
ext.sealedRepo = (findProperty("harnessSealedRepo") ?: "https://packages-cf.termux.dev/apt/termux-main").toString()

// ---------------------------------------------------------------------------
// Target API level.
//
// Play requires API 36 for new apps and updates from 2026-08-31. The apt build
// cannot follow: Android 10+ refuses execve() on files under app data, and that
// build runs its userland from there, so the default target stays 28 (like
// Termux). A store build is built with -PharnessTargetSdk=36 and would run at 36
// without any change: its executables come out of the APK.
//
// AGP 8 does not let a build type override targetSdk (it was removed), so the
// value is project-wide and the store artefact is identified by the task that
// makes it. A bundle built at a target Play rejects is refused here, with the
// command that fixes it, instead of at upload time.
// ---------------------------------------------------------------------------
def bundleTargetSdk = 36
def requestedTaskNames = gradle.startParameter.taskNames.join(" ").toLowerCase()
def requestsBundle = requestedTaskNames.contains("bundle")
if (requestsBundle && (rootProject.ext.targetSdkVersion as Integer) < bundleTargetSdk) {
    throw new GradleException(
        "a Play bundle must target API ${bundleTargetSdk}, but this build targets "
            + "${rootProject.ext.targetSdkVersion}: re-run with "
            + "-PharnessTargetSdk=${bundleTargetSdk} -PharnessCompileSdk=${bundleTargetSdk}")
}

android {
    namespace "io.mcyber12.codingharness"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "io.mcyber12.codingharness"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 40
        versionName "0.33.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // The base module has to name its feature modules, or the bundle is built
    // without them and the pack simply does not exist for Play to deliver. This
    // list is also what makes the pack APK a build output of this project.
    dynamicFeatures = [":pack-buildtools"]

    sourceSets {
        main {
            assets.srcDir(bootstrapOutput)
        }
    }

    // Note: no jniLibs packaging override - libharness-exec.so is extracted
    // from the APK at bootstrap-provisioning time instead (see
    // HarnessBootstrap.ensureHarnessExecLibrary), because modern AGP keeps
    // .so files compressed and a dlopen() path cannot point into the APK.

    // The androidTest variant follows this property, so a build type other than
    // `debug` can be instrumented without changing the default pipeline:
    //   ./gradlew :app:connectedSealedAndroidTest -PharnessTestBuildType=sealed
    testBuildType = (findProperty("harnessTestBuildType") ?: "debug").toString()

    packagingOptions {
        // The sealed variant ships a PIE executable under a JNI library name
        // (see terminal-emulator/src/main/jni/harness-probe.c). Stripping an
        // executable is not the same operation as stripping a library, so it
        // is excluded rather than trusted to survive --strip-unneeded.
        jniLibs {
            keepDebugSymbols.add("**/libharnessprobe.so")
        }
    }

    signingConfigs {
        release {
            if (canSignRelease) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                // v1 is still needed by API 24-27 era tooling on some devices;
                // v2/v3 are what Play verifies, and v4 enables fast installs.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // The uploaded artefact: it carries the payload and extracts its
            // libraries. Built with -PharnessTargetSdk=36 it is the store shape.
            if (canSignRelease) {
                signingConfig signingConfigs.release
            }
        }
        // `sealed`: the store-shaped build (docs/play-store-plan.md).
        //
        // Two things change, and only these two:
        //   * app/src/sealed/AndroidManifest.xml sets extractNativeLibs=true,
        //     so the executables this build ships are extracted to the native
        //     library directory as real files. Without that they stay inside
        //     the APK, where nothing can execve() them.
        //   * it is built with -PharnessTargetSdk=34, i.e. the target a store
        //     submission would need, which is the point of the variant: the
        //     data-dir exec exemption is gone, so anything that still runs
        //     proves the sealed layout carries the harness.
        // It is debuggable so instrumentation and run-as can inspect it; it
        // shares the debug signing key and the shipping applicationId, exactly
        // like the `smoke` variant in the reference harness.
        sealed {
            initWith(getByName("debug"))
            debuggable = true
            // Same shape as `release`, debuggable so instrumentation can run
            // against it; measured at whatever target the gate asks for.
            matchingFallbacks.addAll(["debug", "release"])
        }
    }

    // Only the store-shaped variants carry the split userland: the payload
    // trees are per-ABI, so they cannot live in the shared `main` source set.
    //
    // `sealed` is the one instrumentation runs against (debuggable), `release`
    // is the one uploaded (Play refuses a debuggable bundle). They share the
    // payload, so the gate exercises the artefact's own shape.
    sourceSets {
        sealed {
            assets.srcDir(new File(project.sealedPayloadDir.get().asFile, "assets"))
            jniLibs.srcDir(new File(project.sealedPayloadDir.get().asFile, "jniLibs"))
        }
        release {
            assets.srcDir(new File(project.sealedPayloadDir.get().asFile, "assets"))
            jniLibs.srcDir(new File(project.sealedPayloadDir.get().asFile, "jniLibs"))
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/** Logged once, so an AAB never leaves without saying which key signed it. */
tasks.matching { it.name in ["bundleRelease", "bundleSealed", "assembleRelease"] }.configureEach {
    doFirst {
        logger.lifecycle(canSignRelease
            ? "signing ${it.name} with the release key (${releaseKeyAlias})"
            : "signing ${it.name} with the debug key - set keystore.properties "
                + "before uploading this artifact")
    }
}

def sha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[64 * 1024]
        int count
        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}

def downloadBootstrap = tasks.register("downloadHarnessBootstrap") {
    outputs.dir(bootstrapOutput)
    doLast {
        File outputDir = bootstrapOutput.get().asFile
        outputDir.mkdirs()
        bootstrapAssets.each { arch, metadata ->
            File output = new File(outputDir, "bootstrap-${arch}.zip")
            boolean valid = output.isFile() && sha256(output) == metadata.sha256
            if (valid) return

            logger.lifecycle("Downloading Termux bootstrap for ${arch}")
            File temporary = new File(outputDir, output.name + ".part")
            temporary.delete()
            def connection = new URL(metadata.url).openConnection()
            connection.setConnectTimeout(30_000)
            connection.setReadTimeout(180_000)
            connection.setUseCaches(false)
            connection.inputStream.withCloseable { input ->
                temporary.withOutputStream { outputStream ->
                    byte[] buffer = new byte[64 * 1024]
                    int count
                    while ((count = input.read(buffer)) != -1) outputStream.write(buffer, 0, count)
                }
            }
            if (sha256(temporary) != metadata.sha256) {
                temporary.delete()
                throw new GradleException("SHA-256 mismatch for ${metadata.url}")
            }
            if (output.exists() && !output.delete()) throw new GradleException("Unable to replace ${output}")
            if (!temporary.renameTo(output)) throw new GradleException("Unable to activate ${output}")
        }
    }
}

// ---------------------------------------------------------------------------
// Sealed payload (docs/play-store-plan.md)
//
// Splits each ABI's Termux bootstrap into the two halves a modern targetSdk
// needs: the bytes the kernel executes (JNI libraries, which Android extracts
// to the exec-allowed native library directory) and the bytes that are only
// read (extracted into the prefix at first run). The split, the manifest and
// the payload's own verification live in scripts/build-sealed-payload.py so the
// same logic runs on a CI runner and on a workstation.
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// Build-time package fetch: the sealed userland's toolchain.
//
// The apt build installs these on first run; the sealed build may not (Play's
// Device & Network Abuse policy, and the exec model needs the bytes in the
// APK). So they are downloaded here, pinned by the repository's SHA-256, and
// unpacked by build-sealed-payload.py. Dependency resolution, alternatives and
// virtual names are handled by fetch-core-debs.py, and the bootstrap's own dpkg
// database decides what is already present.
// ---------------------------------------------------------------------------
def fetchCoreDebs = tasks.register("fetchCoreDebs") {
    description = "Fetches the core-tier Termux packages for the sealed payload"
    dependsOn(downloadBootstrap)
    inputs.dir(bootstrapOutput)
    inputs.property("packages", project.sealedCorePackages.join(" "))
    inputs.property("repo", project.sealedRepo)
    inputs.file(rootProject.file("scripts/fetch-core-debs.py"))
    outputs.dir(project.sealedDebDir)
    doLast {
        File script = rootProject.file("scripts/fetch-core-debs.py")
        if (!script.isFile()) throw new GradleException("missing ${script}")
        [["aarch64", "arm64-v8a"], ["x86_64", "x86_64"]].each { arch, abi ->
            File zip = new File(bootstrapOutput.get().asFile, "bootstrap-${arch}.zip")
            File output = new File(project.sealedDebDir.get().asFile, abi)
            output.mkdirs()
            // The resolver writes its own transcript: providers.exec throws the
            // moment the child exits non-zero, and then every word it said is
            // gone - including the reason a mirror refused, which is the only
            // thing worth knowing on a networked runner.
            File record = new File(project.layout.buildDirectory.get().asFile,
                "fetch-core-debs-${abi}.log")
            record.parentFile.mkdirs()
            def fetch = providers.exec {
                commandLine(["python3", script.absolutePath,
                    "--arch", arch,
                    "--out", output.absolutePath,
                    "--bootstrap", zip.absolutePath,
                    "--repo", project.sealedRepo,
                    "--log", record.absolutePath,
                    "--packages"] + project.sealedCorePackages)
            }
            def result = fetch.result.get()
            fetch.standardOutput.asText.get().readLines().each { logger.lifecycle(it) }
            result.assertNormalExitValue()
        }
    }
}

def buildSealedPayload = tasks.register("buildSealedPayload") {
    description = "Splits the Termux bootstrap and core packages into a sealed payload"
    dependsOn(downloadBootstrap, fetchCoreDebs)
    inputs.dir(bootstrapOutput)
    inputs.dir(project.sealedDebDir)
    inputs.file(rootProject.file("scripts/build-sealed-payload.py"))
    outputs.dir(project.sealedPayloadDir)
    doLast {
        File script = rootProject.file("scripts/build-sealed-payload.py")
        if (!script.isFile()) throw new GradleException("missing ${script}")
        [["aarch64", "arm64-v8a"], ["x86_64", "x86_64"]].each { arch, abi ->
            File zip = new File(bootstrapOutput.get().asFile, "bootstrap-${arch}.zip")
            if (!zip.isFile()) {
                throw new GradleException("bootstrap for ${abi} not found: ${zip}")
            }
            File debs = new File(project.sealedDebDir.get().asFile, abi)
            if (!debs.isDirectory()) {
                throw new GradleException("core packages for ${abi} were not fetched: ${debs}")
            }
            // The builder tees its own transcript: Gradle throws the moment a
            // captured child exits non-zero, so the reason for the failure - a
            // shared library missing from the payload, say - never reaches the
            // log unless the child writes it down itself.
            // Beside the assets, never inside them: anything under the asset
            // directory is merged into the APK, and two logs with the same name
            // collide in aapt's resource merge.
            File log = new File(bootstrapOutput.get().asFile.parentFile,
                    "sealed-payload-${abi}.log")
            log.parentFile.mkdirs()
            def split = providers.exec {
                commandLine "python3", script.absolutePath,
                    "--bootstrap", zip.absolutePath,
                    "--abi", abi,
                    "--out", project.sealedPayloadDir.get().asFile.absolutePath,
                    "--deb-dir", debs.absolutePath,
                    "--log", log.absolutePath
            }
            def result = split.result.get()
            split.standardOutput.asText.get().readLines().each { logger.lifecycle(it) }
            result.assertNormalExitValue()
        }
    }
}

tasks.matching {
    it.name.startsWith("mergeSealed") || it.name.startsWith("preSealed")
        || it.name.startsWith("mergeRelease") || it.name == "preReleaseBuild"
}.configureEach {
    dependsOn(buildSealedPayload)
}

// Every variant needs the bootstrap assets, not just debug/release: the
// `sealed` variant is its own build type (preSealedBuild), and without this it
// would package an APK with no userland in it at all. Wiring the merge task is
// variant-agnostic, so a build type added later cannot silently miss the
// assets.
tasks.matching { it.name in ["preDebugBuild", "preReleaseBuild"] }.configureEach {
    dependsOn(downloadBootstrap)
}
tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    dependsOn(downloadBootstrap)
}

dependencies {
    implementation project(":harness-core")
    implementation project(":terminal-view")

    androidTestImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
