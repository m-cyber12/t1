name: Android JDK builder

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 17 / Android build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_NDK_HOME" || test -d "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Run JVM tests and assemble debug APK
        run: ./gradlew --no-daemon --stacktrace test :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coding-harness-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
