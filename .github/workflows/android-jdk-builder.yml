name: Android JDK builder

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 17 / Android build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          # setup-android v3 still defaults to the removed SDK package "tools".
          # Override the default with only supported package names. The action
          # installs each package as a positional sdkmanager argument.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_NDK_HOME" || test -d "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Run JVM tests and assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Annotate Gradle failure
        if: failure()
        shell: bash
        run: |
          report=$(grep -h -m1 -A12 '<failure' terminal-emulator/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | tr '\n' ' ' | cut -c1-8000 || true)
          if [ -n "$report" ]; then
            report=${report//%/%25}
            report=${report//$'\r'/%0D}
            report=${report//$'\n'/%0A}
            echo "::error title=First JUnit failure::$report"
          fi

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coding-harness-gradle-failure-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coding-harness-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
