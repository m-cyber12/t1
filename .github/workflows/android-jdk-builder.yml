name: Android JDK builder

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 17 / Android build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Inspect Termux bootstrap and run its apt
        continue-on-error: true
        shell: bash
        run: |
          WORK="$(mktemp -d)"
          cd "$WORK" || exit 0
          {
            set -x
            set +e
            curl -fsSL -o bs.zip "https://github.com/termux/termux-packages/releases/download/bootstrap-2026.02.12-r1%2Bapt.android-7/bootstrap-x86_64.zip"
            echo "curl exit=$?"
            mkdir rootfs && cd rootfs
            unzip -q ../bs.zip
            P="$PWD"
            echo "== etc/apt =="; ls -la etc/apt
            echo "== sources.list =="; cat etc/apt/sources.list || echo "SOURCES.LIST MISSING"
            echo "== sources.list.d =="; ls -la etc/apt/sources.list.d
            echo "== trusted.gpg.d =="; ls -la etc/apt/trusted.gpg.d
            echo "== methods =="; ls lib/apt/methods
            echo "== dpkg status =="; head -4 var/lib/dpkg/status || echo "STATUS MISSING"
            printf '%s\n' \
              'Apt::Architecture "x86_64";' \
              'Acquire::Retries "2";' \
              "Dir \"$P\";" \
              'Dir::State "var/lib/apt";' \
              'Dir::Cache "var/cache/apt";' \
              'Dir::Cache::archives "archives";' \
              'Dir::Etc "etc/apt";' \
              'Dir::Etc::sourcelist "sources.list";' \
              'Dir::Etc::sourceparts "sources.list.d";' \
              'Dir::Etc::main "apt.conf";' \
              'Dir::Etc::parts "apt.conf.d";' \
              'Dir::Log "var/log/apt";' \
              'Dir::Bin::dpkg "bin/dpkg";' \
              'Dir::Bin::methods "lib/apt/methods";' \
              > harness-apt.conf
            export APT_CONFIG="$P/harness-apt.conf"
            export LD_LIBRARY_PATH="$P/lib"
            export HOME="$P/home" TMPDIR="$P/tmp" PREFIX="$P"
            mkdir -p home tmp
            chmod +x bin/* lib/apt/methods/* 2>/dev/null
            echo "== apt-get update (linux loader) =="
            /lib64/ld-linux-x86-64.so.2 ./bin/apt-get update
            echo "loader exit=$?"
            echo "== lists after update =="; ls -la var/lib/apt/lists | head -20
          } > inspect.log 2>&1
          tail -c 4000 inspect.log
          enc() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n' | sed 's/%0A$//'; }
          echo "::notice title=bootstrap-inspect-A::$(enc "$(sed -n 1,40p inspect.log)")"
          echo "::notice title=bootstrap-inspect-B::$(enc "$(sed -n 41,90p inspect.log)")"
          echo "::notice title=bootstrap-inspect-C::$(enc "$(tail -30 inspect.log)")"
          cd /; rm -rf "$WORK"
          exit 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          # setup-android v3 still defaults to the removed SDK package "tools".
          # Override the default with only supported package names. The action
          # installs each package as a positional sdkmanager argument.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_NDK_HOME" || test -d "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Run JVM tests and assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Annotate Gradle failure
        if: failure()
        shell: bash
        run: |
          report=$(grep -h -m1 -A12 '<failure' terminal-emulator/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | tr '\n' ' ' | cut -c1-8000 || true)
          if [ -n "$report" ]; then
            report=${report//%/%25}
            report=${report//$'\r'/%0D}
            report=${report//$'\n'/%0A}
            echo "::error title=First JUnit failure::$report"
          fi

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coding-harness-gradle-failure-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: coding-harness-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
